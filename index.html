<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#181818">
<meta name="color-scheme" content="only light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ปังจนพัง™</title>
<style>
:root{
  --pink:#FF2DAA;--acid:#D7FF00;--blue:#245BFF;--paper:#FFFFFF;--ink:#181818;
  /* Keep poster and flag colors intact when browsers enable Auto Dark Theme. */
  color-scheme:only light;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --font:"Noto Sans Thai","Sukhumvit Set","Thonburi","Leelawadee UI","Loma","Tahoma",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{position:fixed;inset:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font);
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.col{position:fixed;left:0;right:0;margin:0 auto;width:100%;max-width:480px;
  padding-left:calc(12px + var(--sal));padding-right:calc(12px + var(--sar))}
.off{visibility:hidden;opacity:0}
.hidden{display:none!important}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink)}

/* ---------- HUD ---------- */
#hud{top:0;z-index:5;padding-top:calc(var(--sat) + 12px);display:flex;align-items:flex-start;gap:8px;pointer-events:none;transition:opacity .2s}
#scoreCard{padding:5px 10px 4px;min-width:0;flex:0 1 112px}
#score{font-size:30px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.5px;white-space:nowrap}
#bestHud{font-size:14px;font-weight:700;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hudMid{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:4px;min-width:62px}
#battery{display:flex;align-items:center;gap:3px;padding:4px 6px 4px 5px;border:3px solid var(--ink);border-radius:9px;background:var(--paper);position:relative}
#battery::after{content:"";position:absolute;right:-7px;top:9px;width:4px;height:10px;background:var(--ink);border-radius:0 2px 2px 0}
#battery i{display:block;width:13px;height:18px;border-radius:3px;border:2px solid var(--ink);background:transparent}
#battery i.on{background:var(--acid)}
#battery.low i.on{background:var(--pink)}
#battery.hit{animation:shakeX .35s}
#streak{font-size:18px;font-weight:900;padding:2px 10px;border:3px solid var(--ink);border-radius:999px;background:var(--pink);color:var(--ink);white-space:nowrap;transform:rotate(-3deg);transition:transform .12s}
#streak.pop{transform:rotate(-3deg) scale(1.18)}
#nextCard{position:relative;width:84px;flex:0 0 84px;padding:9px 3px 3px;display:flex;flex-direction:column;align-items:center;gap:1px}
#nextCard .tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--ink);color:var(--acid);font-size:12px;font-weight:900;line-height:1.5;padding:0 7px;border-radius:6px;white-space:nowrap}
#nextCv{width:74px;height:26px;display:block}
#nextName{font-size:15px;font-weight:900;line-height:1.2;max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{pointer-events:auto}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- event banner ---------- */
#evb{z-index:6;top:calc(var(--sat) + 90px);pointer-events:none;display:flex;justify-content:center;transition:opacity .2s,transform .2s}
#evb .evcard{display:flex;align-items:center;gap:10px;padding:6px 10px;max-width:100%;background:var(--acid);border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-1deg)}
#evb.active .evcard{background:var(--pink)}
#evb .evico{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;background:var(--ink);border-radius:50%}
#evb .evico svg{width:20px;height:20px}
#evb b{display:block;font-size:18px;font-weight:900;line-height:1.15}
#evb small{display:block;font-size:14px;font-weight:700;line-height:1.2}
#evb .evcount{font-size:22px;font-weight:900;min-width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center;padding:0 6px}
#evb.flash .evcard{animation:pulse .5s ease-in-out 3}
@keyframes pulse{50%{transform:rotate(-1deg) scale(1.06)}}

/* ---------- joke notifications (fake phone push from fictional apps) ---------- */
#notif{z-index:6;bottom:calc(var(--sab) + 92px);pointer-events:none;display:flex;justify-content:center;transition:opacity .2s,transform .25s cubic-bezier(.2,1.3,.4,1)}
#notif.hide{opacity:0;transform:translateY(16px)}
#notif .nc{display:flex;align-items:center;gap:10px;width:100%;max-width:420px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--ink);padding:6px 12px 6px 7px}
#notifIco{width:36px;height:36px;flex:0 0 36px;display:block}
#notif .nt{min-width:0;flex:1 1 auto}
#notif .nh{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;line-height:1.25;opacity:.62}
#notifMsg{font-size:16px;font-weight:800;line-height:1.25}

/* ---------- bottom control pad ---------- */
#pad{z-index:5;bottom:0;padding-bottom:calc(var(--sab) + 10px);pointer-events:none;transition:opacity .2s}
.padbar{height:72px;border-radius:18px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 0 10px;box-shadow:0 -3px 0 rgba(24,24,24,.12)}
.skipBox{display:flex;align-items:center;gap:6px;padding:6px 0;border-radius:12px;transition:background .1s;flex:0 0 auto}
.skipBox.holding{background:var(--acid);color:var(--ink)}
.skipBox.denied{animation:shakeX .3s}
.pips{display:flex;gap:5px}
.pips i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--paper);display:block;background:transparent}
.skipBox.holding .pips i{border-color:var(--ink)}
.pips i.on{background:var(--pink)}
.skipTxt{font-size:16px;font-weight:800;line-height:1.15;white-space:nowrap}
.skipTxt small{display:block;font-size:13px;font-weight:700;opacity:1}
.tapHint{font-size:18px;font-weight:900;color:var(--acid);white-space:nowrap;text-align:right;line-height:1.2}
.tapHint span{display:block;color:var(--paper);font-weight:700}
#fxRow{display:flex;flex-wrap:wrap;justify-content:flex-end;align-content:center;gap:4px;min-width:0}
#fxRow:empty{display:none}
.fx{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 9px;border-radius:999px;border:2px solid var(--paper);font-size:15px;font-weight:900;white-space:nowrap}
.fx i{font-style:normal;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:13px;display:grid;place-items:center}

/* ---------- tutorial ---------- */
#tut{z-index:7;top:calc(var(--sat) + 92px);display:flex;justify-content:center;pointer-events:none;transition:opacity .25s}
#tut .bubble{display:flex;align-items:center;gap:12px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:8px 14px 8px 10px;font-size:19px;font-weight:900;line-height:1.3;max-width:100%}
#tut .bubble small{display:block;font-size:15px;font-weight:700;opacity:.8}
#tut .finger{flex:0 0 40px;width:40px;height:40px;animation:tapAnim .9s ease-in-out infinite}
#tut.hold .finger{animation:holdAnim 1.4s ease-in-out infinite}
@keyframes tapAnim{0%,100%{transform:scale(1)}40%{transform:scale(.72)}}
@keyframes holdAnim{0%{transform:scale(1)}15%,85%{transform:scale(.72)}100%{transform:scale(1)}}

/* ---------- buttons ---------- */
.btn{font-family:inherit;font-weight:900;font-size:21px;line-height:1.1;min-height:56px;padding:0 16px;border:3px solid var(--ink);border-radius:16px;
  background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  touch-action:manipulation;transition:transform .06s,box-shadow .06s;-webkit-appearance:none;appearance:none}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
.btn.big{min-height:64px;font-size:26px;width:100%}
.btn.pink{background:var(--pink)}
.btn.acid{background:var(--acid)}
.btn.blue{background:var(--blue);color:var(--paper)}
.btn.sq{width:56px;height:56px;padding:0;flex:0 0 56px}
.btn.sq svg{width:28px;height:28px}
.btn .ico{width:22px;height:22px;flex:0 0 22px}
.btn[disabled]{opacity:.55}
.row{display:flex;gap:10px;width:100%}
.row .btn{flex:1 1 auto;min-width:0}
.volrow{display:flex;align-items:center;gap:12px;width:100%}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1 1 auto;min-width:0;height:56px;background:transparent;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:8px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;margin-top:-10px;border-radius:50%;background:var(--acid);border:3px solid var(--ink)}
input[type=range]::-moz-range-track{height:12px;border-radius:8px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--acid);border:3px solid var(--ink)}

/* ---------- language flags ---------- */
.flags{display:flex;gap:8px;flex:0 0 auto}
.flagBtn{font-family:inherit;min-height:56px;min-width:62px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:3px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:17px;font-weight:900;
  cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;transition:transform .06s,box-shadow .06s,background .1s}
.flagBtn svg{width:36px;height:24px;display:block;border-radius:4px;box-shadow:0 0 0 2px var(--ink);flex:0 0 36px;filter:none;opacity:1}
.flagBtn span{display:none;white-space:nowrap}
.flags.big .flagBtn span{display:inline}
.flagBtn[aria-pressed="true"]{background:var(--acid);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.flagBtn:focus-visible{outline:4px solid var(--blue);outline-offset:2px}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;
  padding:calc(var(--sat) + 14px) calc(14px + var(--sar)) calc(var(--sab) + 14px) calc(14px + var(--sal))}
.wrap{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.dim{background:rgba(24,24,24,.6)}
.sheet{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:18px 16px;height:auto;max-height:100%;margin:auto 0;gap:12px;overflow-y:auto;touch-action:pan-y}
.sheet > *{flex-shrink:0}
.sheet h2{font-size:30px;font-weight:900;line-height:1.1}
.sheet p{font-size:18px;font-weight:700;opacity:.8}
.stage{flex:1 1 auto;width:100%;min-height:60px;pointer-events:none}
#menu .wrap > :not(.stage){flex-shrink:0}

/* logo */
.logoWrap{position:relative;text-align:center;width:100%}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;line-height:1.35;white-space:nowrap}
.logo .l1{color:var(--ink);text-shadow:4px 4px 0 var(--pink)}
.logo .l2{background:var(--pink);color:var(--ink);border:4px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);
  padding:0 12px;line-height:1.3;transform:rotate(-6deg);display:inline-block}
.logo sup{font-size:.32em;vertical-align:top;margin-left:2px}
body.en .logo{flex-direction:column;gap:6px;line-height:1.05;letter-spacing:-.5px}
body.en .logo .l2{line-height:1.12;padding:3px 16px 0}
.stk{display:inline-block;font-weight:900;border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:3px 10px;white-space:nowrap}
.logoWrap .s1{position:absolute;left:2px;top:-20px;background:var(--acid);font-size:15px;transform:rotate(-7deg)}
.logoWrap .s2{position:absolute;right:2px;bottom:-18px;background:var(--blue);color:var(--paper);font-size:15px;transform:rotate(5deg)}
.tagline{font-size:21px;font-weight:900;background:var(--ink);color:var(--paper);padding:4px 12px;border-radius:8px;transform:rotate(-1.5deg);text-align:center}
.note{font-size:14px;font-weight:700;opacity:.8;text-align:center}

/* menu */
#menu .wrap{align-items:center}
#menu .logoWrap{margin-top:22px}
#menu .logo{font-size:min(46px,11.5vw)}
body.en #menu .logo{font-size:min(44px,11.5vw)}
body.en #menu .logoWrap{margin-top:34px}
body.en .logoWrap .s1{top:-32px}
body.en .logoWrap .s2{bottom:-24px;right:-2px}
#menu .tagline{margin-top:22px}
#menuBest{font-size:17px;font-weight:800;background:var(--paper);padding:3px 12px;border-radius:999px;border:3px solid var(--ink);text-align:center}
#menu .btn.big{font-size:30px;min-height:68px}
.row2{display:flex;align-items:center;gap:12px;width:100%}

/* results */
#results{background:var(--paper)}
#results .wrap{gap:8px;padding:8px 6px;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#results .wrap::-webkit-scrollbar{display:none}
#results .wrap > *{flex-shrink:0}
.resTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.resTop .boom{background:var(--pink);font-size:28px;transform:rotate(-4deg);padding:2px 14px}
#resNew{background:var(--acid);font-size:16px;transform:rotate(5deg)}
#resCause{font-size:16px;font-weight:800;line-height:1.3;background:var(--ink);color:var(--paper);border-radius:10px;padding:6px 10px}
#resCause b{color:var(--acid)}
.resScore{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:4px}
.resScore > div:first-child{flex:1 1 0;min-width:0}
.resScore small{display:block;font-size:15px;font-weight:800;opacity:.75}
#resScore{font-size:58px;font-weight:900;line-height:1.05;letter-spacing:-1px;font-variant-numeric:tabular-nums;white-space:nowrap}
#resBest{font-size:16px;font-weight:800;text-align:right;line-height:1.25;flex:0 0 32%;min-width:0;overflow-wrap:anywhere}
.titleBadge{background:var(--blue);color:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:8px 12px;transform:rotate(-1deg)}
.titleBadge small{font-size:14px;font-weight:800;color:var(--acid);display:block}
#resTitle{display:block;font-size:24px;font-weight:900;line-height:1.15}
#resTitleSub{display:block;font-size:15px;font-weight:700;font-style:normal;opacity:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border:3px solid var(--ink);border-radius:12px;padding:4px 10px;background:#fff;min-width:0}
.stat small{display:block;font-size:13px;font-weight:800;opacity:.7}
.stat b{display:block;font-size:22px;font-weight:900;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px}
.chip{font-size:15px;font-weight:900;border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px;background:var(--acid);max-width:100%;white-space:normal;overflow-wrap:anywhere}
.chip.new::after{content:" NEW";color:var(--pink)}
.chip.ghost{background:transparent;font-weight:700;white-space:normal}
#resTip{font-size:15px;font-weight:700;line-height:1.3;opacity:.85}
.brand{font-size:13px;font-weight:800;opacity:.6;text-align:center}
#results .actions{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding:10px 0 8px;position:sticky;bottom:-8px;z-index:1;background:var(--paper);box-shadow:0 -8px 12px var(--paper)}
#results .row .btn{font-size:19px;padding:0 10px}

/* book */
#bookList{display:flex;flex:1 1 auto;flex-direction:column;gap:6px;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;min-height:0;max-height:64vh}
#bookList .bk{flex-shrink:0}
.bk{border:3px solid var(--ink);border-radius:12px;padding:5px 10px;background:#fff}
.bk.lock{background:transparent;border-style:dashed}
.bk b{font-size:17px;font-weight:900;display:block;line-height:1.2}
.bk .rec{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0}
.bk .rec span{font-size:14px;font-weight:800;border:2px solid var(--ink);border-radius:6px;padding:0 6px}
.bk small{display:block;font-size:13px;font-weight:700;opacity:.8;line-height:1.3}
.bookTabs{gap:6px;flex-shrink:0}
.bookTabs .btn{min-height:44px;font-size:15px;padding:0 8px;box-shadow:none;border-width:2px;border-radius:10px}
.bookTabs .btn[aria-pressed="true"]{background:var(--acid)}
#bookSummary{font-size:14px;font-weight:800}
.bk.earned{background:var(--acid)}
.extremeBadge{display:inline-block;margin:4px 0;padding:2px 7px;border-radius:5px;background:var(--pink);color:var(--ink);font-size:11px;font-weight:900}
.medalProgress{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px;font-weight:800}
.medalProgress progress{width:100%;height:10px;accent-color:var(--blue)}
#resAchievements{font-size:14px;font-weight:800;line-height:1.35;color:var(--ink)}

#toast{position:fixed;z-index:30;left:50%;top:calc(var(--sat) + 138px);transform:translateX(-50%);max-width:92vw;background:var(--ink);color:var(--paper);
  font-size:16px;font-weight:800;padding:8px 14px;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center}
#toast.show{opacity:1}
#rotate{position:fixed;inset:0;z-index:50;background:var(--ink);color:var(--paper);display:none;place-items:center;text-align:center;font-size:22px;font-weight:900;padding:20px}
@media (orientation:landscape) and (max-height:500px){#rotate{display:grid}}
@media (max-height:700px){
  #resScore{font-size:48px}.titleBadge{padding:6px 10px}#resTitle{font-size:21px}.stat b{font-size:19px}
  #menu .logo{font-size:min(40px,11vw)}#menu .tagline{margin-top:18px;font-size:19px}#resCause{font-size:15px}
}
@media (max-width:360px){
  .flags.big .flagBtn span{display:none}
  #hud{gap:6px}
  #scoreCard{padding:5px 6px 4px}#score{font-size:26px}#bestHud{font-size:12px}
  #nextCard{width:68px;flex-basis:68px}#nextCv{width:62px;height:22px}#nextName{font-size:13px;max-width:62px}
  #btnPause{width:48px;flex-basis:48px}
  .skipTxt{font-size:15px}.skipTxt small{font-size:12px}
  #resNew{font-size:14px;padding:2px 8px}
}
@media (max-height:620px){
  .stage{min-height:40px}
  #menu .wrap{gap:8px}
  #menu .logoWrap,body.en #menu .logoWrap{margin-top:26px}
  body.en #menu .logo{font-size:30px}
  #menu .logoWrap .s1{top:-24px;font-size:13px}#menu .logoWrap .s2{bottom:-18px;font-size:13px}
  #menu .tagline{font-size:17px;margin-top:16px}#menuBest{font-size:14px}
  #menu .btn.big{font-size:26px;min-height:60px}#btnBook{font-size:18px}
}
@media (prefers-reduced-motion:reduce){#tut .finger{animation:none}}
/* A usable document preview remains visible until the first successful game frame. */
#launchFallback{position:fixed;inset:0;z-index:100;background:var(--pink);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;touch-action:pan-y}
#launchFallback .launchCard{width:100%;max-width:440px;background:var(--paper);border:4px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);padding:28px 24px;text-align:center}
#launchFallback .launchBadge{display:inline-block;padding:4px 12px;margin-bottom:18px;background:var(--acid);border:3px solid var(--ink);border-radius:10px;font-size:16px;font-weight:900;transform:rotate(-4deg)}
#launchFallback h1{font-size:clamp(34px,10vw,52px);font-weight:900;line-height:1.3;margin-bottom:4px}
#launchFallback .launchEnglish{font-size:18px;font-weight:800;margin-bottom:24px}
#launchFallback p{font-size:19px;line-height:1.55;margin-bottom:20px}

  const w = Math.round(T.w * r.S * shrink / 4) * 4, h = Math.round(T.h * r.S);   // quantised → few sprite sizes
  const ev = r.event ? r.event.def.id : null;
  const guarded = r.fx.guard > 0 && CRISIS_IDS.includes(ev);
  let m = T.m; if (ev === 'rent' && typeId === 'rent') m *= 1.3;
  if (!guarded) {
    if (ev === 'interest' && ['rent','lux'].includes(typeId)) m *= 1.45;
    if (ev === 'war' && ['work','coffee'].includes(typeId)) m *= 1.35;
    if (ev === 'scam' && ['likes','lux'].includes(typeId)) m *= 2;
  }
  r.spawnSide *= -1;
  const [lo, hi] = travelRange(w);
  r.cur = {type:typeId, w, h, m, x:r.spawnSide < 0 ? lo : hi, y:topY() + r.hover, vy:0, state:'moving', dir:-r.spawnSide, ev, guarded, t:0, press:0, appear:0, shakeT:0};
  if (ev === 'trend') { const side = Math.random() < 0.5 ? -1 : 1, t = topBlock(); r.trend = {x:t.x + side * rand(34, 52) * r.S, w:36 * r.S}; }
  else r.trend = null;
  UI.drawNext();
}

/* --- per-frame play update --- */
function updatePlay(dt) {
  const r = run; r.t += dt;
  const b = r.cur;
  if (!b) { if (G.spawnIn > 0) { G.spawnIn -= dt; if (G.spawnIn <= 0) spawn(); } return; }
  b.t += dt; b.appear = Math.min(1, b.appear + dt * 7); b.shakeT = Math.max(0, b.shakeT - dt);
  if (b.state === 'moving') {
    const [lo, hi] = travelRange(b.w), v = speed();
    b.x += b.dir * v * dt;
    while (b.x > hi || b.x < lo) { if (b.x > hi) { b.x = hi - (b.x - hi); b.dir = -1; } else { b.x = lo + (lo - b.x); b.dir = 1; } }
    b.y = lerp(b.y, topY() + r.hover, 1 - Math.exp(-dt * 10));
  } else if (b.state === 'held') {
    b.press += dt; b.y = lerp(b.y, topY() + r.hover, 1 - Math.exp(-dt * 10));
  } else if (b.state === 'falling') {
    b.vy += CFG.g * dt; b.y -= b.vy * dt;
    const tv = topVisual(), yAt = tv.y + Math.tan(tv.a) * (b.x - tv.x);
    if (-b.y >= yAt) { b.y = -yAt; const [lx] = inv(b.x, yAt, r.blocks.length - 1); landBox(b, lx); }
  }
}

function landBox(b, lx) {
  const r = run, top = topBlock(), n0 = r.blocks.length;
  const d = resolveDrop(b, lx), perfect = d.perfect, trendHit = d.trendHit;
  if (d.miss) { r.cur = null; missBox(b, Math.sign(d.dx) || 1, d.noContact); return; }
  const nb = {type:b.type, x:d.x, y:top.y + top.h, w:b.w, h:b.h, m:b.m, sq:perfect ? 0.14 : 0.1, flash:perfect ? 0.65 : 0};
  r.blocks.push(nb); r.ang.push(0); r.angV.push(0);
  const prevRisk = r.an.maxRisk;
  const an = analyze();
  if (an.fail > 0) { r.cur = null; collapse(an.fail, an.failDir, 'topple'); return; }
  // success
  r.cur = null;
  const st = r.stats;
  r.placed++; st.by[b.type]++;
  st.maxHeight = Math.max(st.maxHeight, r.blocks.length - 1);
  if (perfect) { r.streak++; st.perfect++; st.maxStreak = Math.max(st.maxStreak, r.streak); } else r.streak = 0;
  r.angV[n0] += perfect ? 0 : clamp(d.dx / top.w, -0.6, 0.6) * 2.4;
  const mult = (r.fx.viral > 0 ? 2 : 1) * (r.fx.jitter > 0 ? 3 : 1) * (b.ev === 'payday' ? 2 : 1) * (trendHit ? 3 : 1);
  let pts = (perfect ? 20 + 5 * Math.min(r.streak - 1, 10) : 10) * mult;
  if (b.ev === 'meeting' && perfect) pts += 50;
  if (b.ev === 'market') {
    if (!b.guarded && ['likes','lux'].includes(b.type)) pts = Math.max(1, Math.round(pts / 2));
    if (perfect) pts += 30;
  }
  r.score += pts;
  const [vx, vy] = fwd(nb.x, -(nb.y + nb.h), r.blocks.length - 1);
  floater('+' + pts + (mult > 1 ? '  ×' + mult : ''), vx, vy - 10, perfect ? C.pink : C.ink, perfect ? 22 : 18);
  if (trendHit) { st.trendHits++; floater(S('onTrend'), vx, vy - 40, C.pink, 20); }
  r.skipMeter += perfect ? 2 : 1;
  while (r.skipMeter >= CFG.skipCost) { r.skipMeter -= CFG.skipCost; if (r.skips < CFG.skipMax) { r.skips++; UI.pulseSkip(); } }
  if (r.skips >= CFG.skipMax) r.skipMeter = 0;
  // juice
  if (!perfect) SFX.land(b.m, false); buzz(perfect ? 10 : 7);
  if (perfect) {
    SFX.perfect(r.streak);
    burst(vx, vy, 4 + Math.min(r.streak, 3), [C.acid, C.pink], 0.55);
    const sq = tx(Q.streak)[r.streak]; if (sq) Notif.show('algo', sq, 2);
  } else burst(vx, vy, 3, [C.ink, C.paper], 0.45);
  // danger / recovery feedback
  if (an.maxRisk > 0.62) {
    if (r.t - r.dangerT > 6) { r.dangerT = r.t; SFX.creak(an.maxRisk); }
  }
  if (an.maxRisk > 0.8) st.nearMiss++;
  if (prevRisk > 0.65 && an.maxRisk < prevRisk - 0.25) {
    st.recover++; r.score += 40; SFX.recover(); floater(S('saved'), vx, vy - 44, C.blue, 20);
    Notif.show('eng', pick(tx(Q.recover)), 2);
  }
  // the box you just placed "pushes" its joke (first time each run, then sometimes)
  if (!r.quipSeen[b.type]) { if (Notif.show(b.type, pick(tx(TYPES[b.type].quips)), 1)) r.quipSeen[b.type] = 1; }
  else if (Math.random() < 0.22) Notif.show(b.type, pick(tx(TYPES[b.type].quips)), 1);
  // milestone
  const hgt = r.blocks.length - 1;
  if (hgt >= r.nextMilestone) {
    r.score += 100; SFX.milestone(); buzz([12, 30, 12]);
    banner(tx(Q.floors)[r.nextMilestone] || S('floorDefault', r.nextMilestone), S('heightBonus'), C.acid, false, 1.5);
    r.nextMilestone += 10;
  }
  consumeBox('place', b);
  r.history.push(b.type); if (r.history.length > 6) r.history.shift();
  checkCombos();
  checkAchievements();
  G.spawnIn = 0.05;
}

function missBox(b, dir, noContact) {
  const r = run, st = r.stats;
  r.battery--; r.streak = 0; r.history = []; st.misses++;
  const tv = topVisual();
  G.debris.push({type:b.type, w:b.w, h:b.h, x:b.x, y:-b.y - b.h / 2, a:tv.a, vx:noContact ? 0 : dir * 140, vy:noContact ? b.vy * 0.6 : -80, va:noContact ? dir * 1.5 : dir * 5.5, life:0, dizzy:true});
  SFX.miss(); SFX.battery(); buzz(45); G.shake = Math.max(G.shake, 6);
  Notif.show('gravity', pick(tx(Q.miss)), 3);
  UI.batteryHit();
  consumeBox('miss', b);
  if (r.battery <= 0) { collapse(1, dir, 'battery'); return; }
  G.spawnIn = 0.35;
}

function consumeBox(kind, b) {
  const r = run;
  r.consumed++;
  for (const k in r.fx) if (r.fx[k] > 0) r.fx[k]--;
  if (r.event && b && b.ev === r.event.def.id) { r.event.left--; if (r.event.left <= 0) endEvent(); else UI.event(); }
  if (r.pending) { r.pending.count--; if (r.pending.count <= 0) startEvent(); else UI.event(); }
  else if (!r.event && r.tut < 0 && r.consumed >= r.nextEventAt) announceEvent();
  if (r.tut >= 0) tutAdvance();
}

function checkCombos() {
  const r = run, h = r.history;
  let best = null;
  for (const c of COMBOS) {
    const n = c.seq.length;
    if (h.length >= n && c.seq.every((t, i) => h[h.length - n + i] === t) && (!best || n > best.seq.length)) best = c;
  }
  if (best) triggerCombo(best);
}
function triggerCombo(c) {
  const r = run, st = r.stats;
  r.history = [];
  const isNew = !Store.d.disc[c.id];
  if (isNew) { Store.d.disc[c.id] = 1; Store.save(); st.newCombos.push(c.id); }
  if (!st.combos.includes(c.id)) st.combos.push(c.id);
  r.score += c.bonus;
  const tv = topVisual();
  switch (c.id) {
    case 'ot': r.fx.ot = 3; burst(tv.x, tv.y, 26, [C.blue, C.paper, C.acid], 1.2); break;
    case 'rich': G.gold = 2.4; floater(S('richMoney'), tv.x, tv.y - 118, C.ink, 22); floater(S('richStab'), tv.x, tv.y - 88, C.pink, 18); break;
    case 'qq': r.fx.qq = 4; G.qqFx = 1; if (r.battery < CFG.battery) { r.battery++; floater(S('plusBattery'), tv.x, tv.y - 50, C.blue, 20); } else if (r.skips < CFG.skipMax) r.skips++; break;
    case 'loan': r.anchor = r.blocks.length - 1; analyze(); floater(S('loanOk'), tv.x, tv.y - 50, C.ink, 20); G.shake = Math.max(G.shake, 8); break;
    case 'viral': r.fx.viral = 5; for (let i = 0; i < 24; i++) G.parts.push({x:tv.x + rand(-80, 80), y:tv.y + rand(-10, 40), vx:rand(-30, 30), vy:rand(-260, -120), g:-40, life:0, max:rand(1, 1.8), size:rand(8, 14), col:C.pink, shape:'heart', a:0, va:rand(-2, 2)}); break;
    case 'wlb': if (r.battery < CFG.battery) r.battery++; if (r.skips < CFG.skipMax) r.skips++; burst(tv.x, tv.y, 20, [C.acid, C.blue], 1); break;
    case 'jitter': r.fx.jitter = 4; G.shake = Math.max(G.shake, 7); break;
  }
  if (c.grants) {
    const g = c.grants;
    r.battery = Math.min(CFG.battery, r.battery + (g.battery || 0));
    r.skips = Math.min(CFG.skipMax, r.skips + (g.skips || 0));
    for (const key of ['ot','qq','guard']) if (g[key]) r.fx[key] = Math.max(r.fx[key], g[key]);
    if (g.gold) G.gold = g.gold;
    burst(tv.x, tv.y, 5, [c.col, C.acid], 0.5);
  }
  SFX.combo(c.id); buzz([18, 40, 18]);
  G.flash = 0.35; G.flashCol = c.col === C.ink ? C.acid : c.col;
  banner(tx(c.name), tx(c.joke), c.col, isNew, 1.6, c.id);
}

/* --- events: announced 2 boxes ahead, then last a few boxes --- */
function announceEvent() {
  const r = run;
  const pool = Object.values(EVENTS).filter(e => e.id !== r.lastEvent);
  let tot = pool.reduce((s, e) => s + e.w, 0), x = Math.random() * tot, def = pool[0];
  for (const e of pool) { x -= e.w; if (x <= 0) { def = e; break; } }
  r.pending = {def, count:2};
  if (def.id === 'rent') r.forced.push(null, 'rent', 'rent');
  SFX.alert(); UI.event(true);
}
function startEvent() {
  const r = run, def = r.pending.def;
  r.event = {def, left:def.len}; r.pending = null; r.lastEvent = def.id; r.stats.events++;
  r.nextEventAt = r.consumed + def.len + rint(8, 12);
  SFX.eventStart(); UI.event(true);
}
function endEvent() {
  const r = run, id = r.event && r.event.def.id;
  // A last-box failure is not a completed crisis, even if consumeBox ran first.
  if (CRISIS_IDS.includes(id) && G.state === 'play' && r.battery > 0) {
    r.stats.survived[id] = (r.stats.survived[id] || 0) + 1;
    Store.d.survived[id] = (Store.d.survived[id] || 0) + 1;
    checkAchievements(); Store.save();
  }
  r.event = null; r.trend = null; UI.event();
}

function achievementMetrics() {
  const d = Store.d, st = run && run.stats, timedDone = run && run.completedTimed;
  const speedHeight = factor => Math.max(d.records['speed' + factor + 'Height'] || 0, st && run.mode === 'speed' && run.speedFactor === factor ? st.maxHeight : 0);
  return {height:Math.max(d.bestHeight, d.records.height || 0, st ? st.maxHeight : 0), score:Math.max(d.best, d.records.score || 0, run ? run.score : 0),
    streak:Math.max(d.records.streak || 0, st ? st.maxStreak : 0), perfect:Math.max(d.records.perfect || 0, st ? st.perfect : 0),
    recover:Math.max(d.records.recover || 0, st ? st.recover : 0), skips:Math.max(d.records.skips || 0, st ? st.skips : 0),
    combos:COMBOS.filter(c => d.disc[c.id]).length, runs:d.runs, ...d.survived,
    speed1Height:speedHeight(1), speed2Height:speedHeight(2), speed3Height:speedHeight(3),
    speed3Streak:Math.max(d.records.speed3Streak || 0, st && run.mode === 'speed' && run.speedFactor === 3 ? st.maxStreak : 0),
    timedFinish:Math.max(d.records.timedFinish || 0, timedDone && st.maxHeight >= 10 ? 1 : 0),
    timedScore:Math.max(d.records.timedScore || 0, timedDone ? run.score : 0),
    timedClean:Math.max(d.records.timedClean || 0, timedDone && st.maxHeight >= 30 && st.misses === 0 ? 1 : 0),
    crises:CRISIS_IDS.filter(id => d.survived[id] > 0).length,
    ironLife:Math.max(d.records.ironLife || 0, st && st.misses === 0 && st.skips === 0 && CRISIS_IDS.every(id => st.survived[id] > 0) ? st.maxHeight : 0)};
}
function checkAchievements(silent = false) {
  const metrics = achievementMetrics(), fresh = [];
  for (const key of RECORD_KEYS) Store.d.records[key] = metrics[key];
  for (const a of ACHIEVEMENTS) if (!Store.d.ach[a.id] && (metrics[a.metric] || 0) >= a.target) {
    Store.d.ach[a.id] = 1; fresh.push(a);
    if (run) run.stats.newAch.push(a.id);
  }
  if (fresh.length) {
    Store.save();
    if (!silent && G.state === 'play' && !G.banner) UI.toast(S('medalUnlocked') + ': ' + tx(fresh[0].name) + (fresh.length > 1 ? ' +' + (fresh.length - 1) : ''));
  }
}

function tutAdvance() {
  const r = run;
  r.tut++;
  if (r.tut >= 3) {
    UI.tut(3);
    Store.d.tut = true; Store.save();
    r.tut = -1;
    setTimeout(() => { if (run === r) UI.tut(-1); }, 3200);
  } else UI.tut(r.tut);
}

/* --- player verbs --- */
const Game = {
  press(ts) {
    const b = run && run.cur; if (!b || b.state !== 'moving') return false;
    const now = performance.now();
    let dtE = (Number.isFinite(ts) && Math.abs(ts - now) < 1000) ? (ts - G.lastUpdate) / 1000 : 0;
    dtE = clamp(dtE, -0.05, 0.05);
    const [lo, hi] = travelRange(b.w);
    b.x = clamp(b.x + b.dir * speed() * dtE, lo, hi);
    b.state = 'held'; b.press = 0;
    SFX.press();
    return true;
  },
  release() {
    const b = run && run.cur; if (!b || b.state !== 'held') return;
    b.state = 'falling'; b.vy = 140; SFX.drop();
    if (run.tut === 0) UI.tut(0, true);
  },
  unpress() { const b = run && run.cur; if (b && b.state === 'held') b.state = 'moving'; },
  holdSkip() {
    const r = run, b = r && r.cur; if (!b || b.state !== 'held') return;
    if (r.skips <= 0) { b.state = 'moving'; b.shakeT = 0.35; SFX.denied(); buzz([15, 40, 15]); UI.toast(S('denied')); UI.skipDenied(); return; }
    r.skips--; r.stats.skips++;
    if (b.ev === 'scam' && ['likes','lux'].includes(b.type)) {
      r.score += 40; floater('+40', b.x, -b.y - b.h - 44, C.acid, 20);
    }
    G.debris.push({type:b.type, w:b.w, h:b.h, x:b.x, y:-b.y - b.h / 2, a:0, vx:(b.x > 0 ? -1 : 1) * 60 + rand(-40, 40), vy:-620, va:rand(6, 10) * (Math.random() < 0.5 ? -1 : 1), life:0, dizzy:true, yeet:true});
    floater(S('nopeFloat'), b.x, -b.y - b.h - 16, C.pink, 26);
    Notif.show('nope', pick(tx(Q.skip)), 2);
    SFX.skip(); buzz([8, 30, 8]);
    r.cur = null;
    consumeBox('skip', b);
    checkAchievements();
    G.spawnIn = 0.22;
  },
};

/* --- collapse & end of run --- */
function collapse(k, dir, cause) {
  const r = run, B = r.blocks, n = B.length;
  G.state = 'collapse'; G.collapseT = 0; G.slow = 0.45;
  Input.reset();
  let heavy = null, hm = 0;
  for (let i = k; i < n; i++) if (B[i].m > hm) { hm = B[i].m; heavy = B[i].type; }
  const joint = cause === 'topple' ? r.ifaces[k] : null;
  const point = joint ? fwd(dir > 0 ? joint.R : joint.L, -joint.y, k - 1) : null;
  r.cause = {kind:cause, floor:k, dir, heavy, point};
  const piv = (cause === 'topple' && r.ifaces[k]) ? fwd(dir > 0 ? r.ifaces[k].R : r.ifaces[k].L, -r.ifaces[k].y, k - 1) : [0, 0];
  const w0 = cause === 'battery' ? rand(0.6, 1.2) * dir : dir * 1.7;
  for (let i = k; i < n; i++) {
    const b = B[i];
    const [x, y, a] = fwd(b.x, -(b.y + b.h / 2), i);
    const rx = x - piv[0], ry = y - piv[1];
    const chaos = cause === 'battery' ? 1 : 0.35;
    G.debris.push({type:b.type, w:b.w, h:b.h, x, y, a, vx:-w0 * ry + rand(-60, 60) * chaos + dir * 40, vy:w0 * rx * 0.4 + rand(-200, 0) * chaos,
      va:w0 * rand(0.6, 1.6), life:0, dizzy:true, talk:Math.random() < 0.18 ? pick(tx(Q.crash)) : null});
  }
  B.length = k; r.ang.length = k; r.angV.length = k; r.ifaces.length = k;
  if (r.cur) {
    const c = r.cur;
    G.debris.push({type:c.type, w:c.w, h:c.h, x:c.x, y:-c.y - c.h / 2, a:0, vx:dir * 90, vy:-100, va:dir * 4, life:0, dizzy:true});
    r.cur = null;
  }
  analyze();
  G.shake = G.reduce ? 6 : 18; G.flash = 0.6; G.flashCol = C.pink;
  SFX.crash(); buzz([70, 50, 140]);
  banner(S('crashTitle'), cause === 'battery' ? S('crashBattery') : S('crashAt', k, S(dir > 0 ? 'right' : 'left')), C.pink, false, CFG.collapseTime, 'crash');
  UI.tut(-1); UI.event(); Notif.hide();
}

const Demo = {
  blocks:[], falling:null, debris:[], t:0, wait:0.6, phase:0, off:0,
  reset() { this.blocks = []; this.falling = null; this.debris = []; this.phase = 0; this.wait = 0.5; this.off = 0; },
  update(dt) {
    this.t += dt;
    if (this.phase === 0) {
      if (!this.falling) {
        this.wait -= dt;
        if (this.wait <= 0) {
          const type = PLAY_TYPES[(this.blocks.length * 5 + 1) % 6], T = TYPES[type];
          this.off += (this.blocks.length % 2 ? -1 : 1) * rand(6, 22) + (this.blocks.length > 3 ? 9 : 0);
          const sc = L.stage ? clamp(L.stage.height / 300, 0.45, 1.3) : 1;
          this.falling = {type, w:Math.round(T.w * 0.78), h:Math.round(T.h * 0.78), x:this.off, y:-(L.stage ? L.stage.height / sc + 40 : 480), vy:0};
        }
      } else {
        const f = this.falling; f.vy += 2600 * dt; f.y += f.vy * dt;
        const top = -32 - this.blocks.reduce((s, b) => s + b.h, 0);
        if (f.y >= top) { f.y = top; this.blocks.push({type:f.type, w:f.w, h:f.h, x:f.x, sq:0.25}); this.falling = null; this.wait = 0.35;
          if (this.blocks.length >= 7) { this.phase = 1; this.wait = 0.8; } }
      }
    } else if (this.phase === 1) {
      this.wait -= dt;
      if (this.wait <= 0) {
        let y = -32;
        this.blocks.forEach((b, i) => { this.debris.push({type:b.type, w:b.w, h:b.h, x:b.x, y:y - b.h / 2, a:0, vx:40 + i * 22 + rand(-10, 10), vy:-rand(40, 160), va:rand(0.8, 2.4), life:0, dizzy:true}); y -= b.h; });
        this.blocks = []; this.phase = 2; this.wait = 1.6;
      }
    } else { this.wait -= dt; if (this.wait <= 0) this.reset(); }
    for (const b of this.blocks) b.sq = Math.max(0, b.sq - dt * 2.5);
    for (const d of this.debris) { d.vy += 1600 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.a += d.va * dt; }
  },
  draw(c) {
    if (!L.stage) return;
    const ox = L.cx, oy = L.stage.bottom - 6, scale = clamp(L.stage.height / 300, 0.45, 1.3);
    c.save(); c.beginPath(); c.rect(0, L.stage.top - 4, L.W, L.stage.height + 40); c.clip();

    let y = -32;
    for (const b of this.blocks) { drawSprite(c, b, b.x, y, 1 + b.sq * 0.5, 1 - b.sq); y -= b.h; }
    if (this.falling) { const f = this.falling; drawSprite(c, f, f.x, f.y, 1, 1); }
    drawDebris(c, this.debris);
    c.restore();
  },
};

function render() {
  const c = ctx;
  c.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  // Background decoration must never prevent the playable world from rendering.
  c.save();
  try { drawBG(c); }
  catch (e) { console.error(e); c.globalAlpha = 1; c.fillStyle = C.paper; c.fillRect(0, 0, L.W, L.H); }
  finally { c.restore(); }
  if (G.state === 'menu' || !run) { Demo.draw(c); return; }
  const r = run;
  const sh = G.shake > 0 ? G.shake : 0;
  const ox = sh ? rand(-sh, sh) : 0, oy = sh ? rand(-sh, sh) : 0;
  const originY = L.groundY + r.camY;
  c.save(); c.translate(L.cx - r.camX + ox, originY + oy);
  drawGround(c);
  drawTower(c, originY);
  drawCurrent(c);
  drawDebris(c, G.debris, {x:L.cx - r.camX + ox, y:originY + oy});
  drawParts(c, G.parts, false);
  drawFloaters(c);
  c.restore();
  const tv = topVisual();
  drawScreenFX(c, originY + tv.y);
}

async function shareResult() {
  const d = UI.lastResult; if (!d) return;
  const text = S('shareText', d.title, fmt(d.score), d.height);
  try { if (navigator.share) { await navigator.share({title:S('docTitle'), text}); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); UI.toast(S('copied')); return; } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;left:0;top:0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove();
    UI.toast(ok ? S('copied') : text);
  } catch (e) { UI.toast(text); }
}

/* ---------- 10. MAIN LOOP & LIFECYCLE ---------- */
function compactFX(list, alive) {
  let n = 0;
  for (let i = 0; i < list.length; i++) if (alive(list[i])) list[n++] = list[i];
  list.length = n;
}
const partAlive = p => p.life < p.max;
const debrisAlive = d => d.life < 4.5 && d.y < 3000;
const floaterAlive = f => f.life < f.max;
function updateFX(dt) {

  G.flash = Math.max(0, G.flash - dt * 1.6);
  G.slow = Math.max(0, G.slow - dt);
  G.qqFx = run && run.fx.qq > 0 ? Math.min(1, G.qqFx + dt * 3) : Math.max(0, G.qqFx - dt * 2);
  if (G.gold > 0) {
    G.gold -= dt;
    // Same confetti rate at 60/120 Hz; no doubling of particles on ProMotion screens.
    G.goldCarry = (G.goldCarry || 0) + dt * 54;
    const count = Math.floor(G.goldCarry); G.goldCarry -= count;
    for (let i = 0; i < count; i++) G.parts.push({screen:true, x:rand(0, L.W), y:-10, vx:rand(-30, 30), vy:rand(160, 320), g:120, life:0, max:rand(1.6, 2.6), size:rand(6, 11), col:Math.random() < 0.7 ? C.gold : C.acid, shape:Math.random() < 0.55 ? 'coin' : 'tri', a:0, va:rand(-4, 4)});
  }
  for (const p of G.parts) { p.life += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt; }
  compactFX(G.parts, partAlive);
  if (G.parts.length > 400) G.parts.splice(0, G.parts.length - 400);
  for (const d of G.debris) {
    d.life += dt; d.vy += 2100 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.a += d.va * dt;
    if (!d.yeet && d.y + d.h / 2 > 0 && d.vy > 0 && Math.abs(d.x) < L.W) { d.y = -d.h / 2; d.vy *= -0.32; d.vx *= 0.6; d.va *= 0.5; if (Math.abs(d.vy) < 60) d.vy = 0; }
  }
  compactFX(G.debris, debrisAlive);
  for (const f of G.floaters) { f.life += dt; f.y -= 46 * dt; }
  compactFX(G.floaters, floaterAlive);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.dur) G.banner = null; }
}
function updateWorld(dt) {
  const r = run;
  for (let j = 1; j < r.blocks.length; j++) {
    const f = r.ifaces[j]; if (!f) continue;
    const acc = -170 * (r.ang[j] - f.target) - 13 * r.angV[j];
    r.angV[j] += acc * dt; r.ang[j] += r.angV[j] * dt;
    const b = r.blocks[j]; if (b.sq) b.sq = Math.max(0, b.sq - dt * 2.2); if (b.flash) b.flash = Math.max(0, b.flash - dt * 4);
  }

  // follow a drifting tower sideways (part-way) so the top never leaves a narrow phone screen
  const tx0 = clamp(topBlock().x * 0.6, -L.frameW * 0.3, L.frameW * 0.3);

}
function frame(dt, elapsedDt = dt) {
  if (run && G.state === 'play' && !G.paused && run.mode === 'timed') {
    run.elapsed = Math.min(180, run.elapsed + Math.max(0, elapsedDt));
    if (run.elapsed >= 180) {
      Input.reset(); run.cur = null; G.spawnIn = 0; run.completedTimed = true; run.cause = {kind:'time'};
      UI.tut(-1); UI.event(); Notif.hide(); finishRun();
    }
  }
  G.time += dt;
  Input.update();
  if (G.state === 'menu') Demo.update(dt);
  else if (run && !G.paused) {
    const wdt = G.slow > 0 && G.state === 'collapse' ? dt * 0.35 : dt;
    if (G.state === 'play') updatePlay(wdt);
    if (G.state === 'collapse') { G.collapseT += dt; if (G.collapseT >= CFG.collapseTime) finishRun(); }
    updateWorld(wdt);
    updateFX(wdt);

}
let lastT = performance.now(), booted = false;
function loop(ts) {
  const elapsedDt = Math.max(0, (ts - lastT) / 1000), dt = Math.min(0.05, elapsedDt); lastT = ts;
  if (document.hidden) { requestAnimationFrame(loop); return; }
  try {
    frame(dt, elapsedDt); G.lastUpdate = ts; render();
    if (!booted) { $('launchFallback').classList.add('hidden'); booted = true; }
  } catch (e) { console.error(e); }

}

};

window.addEventListener('orientationchange', onResize);
